name: Sync to OneDrive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'RCLONEEOF'
          [onedrive]
          type = onedrive
          token = TOKEN_PLACEHOLDER
          drive_id = DRIVEID_PLACEHOLDER
          drive_type = personal
          RCLONEEOF
          sed -i "s|TOKEN_PLACEHOLDER|${{ secrets.RCLONE_ONEDRIVE_TOKEN }}|" ~/.config/rclone/rclone.conf
          sed -i "s|DRIVEID_PLACEHOLDER|${{ secrets.RCLONE_ONEDRIVE_DRIVE_ID }}|" ~/.config/rclone/rclone.conf

      - name: Sync to OneDrive
        run: |
          rclone sync . onedrive:肉酒場然_プロジェクト \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "__pycache__/**" \
            --exclude "*.pyc" \
            --progress
