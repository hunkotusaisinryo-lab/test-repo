name: Sync to OneDrive

on:
  push:
    branches: [main]
    paths:
      - 'zen/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_ONEDRIVE_TOKEN }}
          RCLONE_DRIVE_ID: ${{ secrets.RCLONE_ONEDRIVE_DRIVE_ID }}
        run: |
          mkdir -p ~/.config/rclone
          printf '[onedrive]\ntype = onedrive\ntoken = %s\ndrive_id = %s\ndrive_type = personal\n' \
            "$RCLONE_TOKEN" "$RCLONE_DRIVE_ID" > ~/.config/rclone/rclone.conf

      - name: Sync to OneDrive
        run: |
          rclone sync . onedrive:肉酒場然_プロジェクト \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude "__pycache__/**" \
            --exclude "*.pyc" \
            --progress
